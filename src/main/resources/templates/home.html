<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>レシピ一覧</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>トップページ</h1>

<a href="/recipes/add">
	<button>投稿</button>
</a>

<form action="/recipes" method="get">
	<input type="search" name="name" placeholder="検索" th:value="${name}">
	<button>検索</button>
</form>

<div>
	<a href="/recipes">全て</a>
	<span th:each="category : ${categories}">
		<a th:href="@{/recipes(categoryId=${category.id})}"
		   th:text="${category.name}">
		</a>
	</span>
</div>

<h2>レシピ一覧</h2>
<div th:each="recipe : ${recipes}">
	<a th:href="@{/recipes/detail(id=${recipe.id})}">
			<span th:text="${recipe.name}">レシピ</span>
		</div>
	</a>
</div>


</body>
</html>
