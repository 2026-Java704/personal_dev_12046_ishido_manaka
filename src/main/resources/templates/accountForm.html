<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新規会員登録</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header th:replace="~{header}"></header>
	
<h1>新規会員登録</h1>

<span th:if="${errorList != null}">
	<div th:each="error : ${errorList}" th:text="${error}"style="color: red;"></div>
</span>

<form action="/users/add" method="post">
	<input type="text" name="name" placeholder="名前"><br>
	<input type="email" name="email" placeholder="メールアドレス"><br>
	<input type="password" name="password" placeholder="パスワード"><br>
	<input type="password" name="passwordConfirm" placeholder="パスワード（確認）"><br>
	<button>新規作成</button>
	<br>
	<a href="/login">ログインページへ</a>
</form>

<footer th:replace="~{footer}"></footer>
</body>
</html>
